# Isolated staging stack. The database here is local to this compose
# project; nothing connects to iris_core or any production host.
name: eeg20-radar

services:
  db:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    environment:
      POSTGRES_DB: iris_staging_db
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      EEG20_DB_USER: eeg20_writer
      EEG20_DB_PASSWORD: ${EEG20_DB_PASSWORD:?set EEG20_DB_PASSWORD in .env}
    volumes:
      - ./docker/initdb/20_iris_staging.sh:/docker-entrypoint-initdb.d/20_iris_staging.sh:ro
      - staging_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${EEG20_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d iris_staging_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  radar:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://eeg20_writer:${EEG20_DB_PASSWORD}@db:5432/iris_staging_db
      EEG20_TARGET_SCHEMA: iris_staging
      EEG20_SCOPE: ${EEG20_SCOPE:-NRW}
      EEG20_REFERENCE_DATE: ${EEG20_REFERENCE_DATE:-}
      EEG20_HORIZON_YEARS: ${EEG20_HORIZON_YEARS:-5}
      EEG20_SOURCE_DIR: /app/fixtures/mastr
      EEG20_OUTPUT_DIR: /app/output
    volumes:
      - ./output:/app/output
    command: ["run"]

  tests:
    profiles: ["test"]
    user: radar
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    depends_on:
      db:
        condition: service_healthy
    environment:
      EEG20_TEST_DATABASE_URL: postgresql://eeg20_writer:${EEG20_DB_PASSWORD}@db:5432/iris_staging_db
      EEG20_TEST_ADMIN_URL: postgresql://${POSTGRES_ADMIN_USER:-postgres}:${POSTGRES_ADMIN_PASSWORD}@db:5432/iris_staging_db
    entrypoint: ["pytest", "-v", "-p", "no:cacheprovider"]

volumes:
  staging_data:
