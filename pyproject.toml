[project]
name = "eeg20-radar"
version = "0.1.0"
description = "Screens MaStR solar units for the end of their 20-year EEG remuneration (IRIS-REG-EEG20)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["eeg20_radar", "conftest"]
